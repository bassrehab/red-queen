[workspace]
resolver = "2"
members = [
    "crates/red-queen-core",
    "crates/red-queen-llm",
    "crates/red-queen-cli",
    "crates/red-queen-python",
]
# Python bindings require maturin, so exclude from default build
default-members = [
    "crates/red-queen-core",
    "crates/red-queen-llm",
    "crates/red-queen-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bassrehab/red-queen"
authors = ["Subhadip Mitra <contact@subhadipmitra.com>"]
keywords = ["evolution", "adversarial", "ai-safety", "red-team", "llm"]
categories = ["science", "algorithms", "command-line-utilities"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parallelism
rayon = "1.8"

# Random
rand = "0.8"
rand_distr = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# CLI
clap = { version = "4.0", features = ["derive"] }

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# Testing
proptest = "1.0"

# Progress bars
indicatif = "0.17"

# Configuration
config = "0.14"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[profile.bench]
lto = true
codegen-units = 1
