[book]
title = "Red Queen"
description = "Evolutionary Adversarial Testing Framework"
authors = ["Subhadip Mitra"]
language = "en"

[build]
build-dir = "book"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/bassrehab/red-queen"
edit-url-template = "https://github.com/bassrehab/red-queen/edit/main/docs/{path}"

[output.html.search]
enable = true
